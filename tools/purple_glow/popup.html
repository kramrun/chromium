<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
body{width:285px;margin:0;padding:16px;font:14px system-ui;background:#191626;color:#f4efff}h1{font-size:18px;margin:0 0 10px}p{line-height:1.4;color:#d1c8e3}label{display:block;margin:12px 0}select,button{font:inherit;padding:8px;border:1px solid #6c5b95;border-radius:8px;background:#302747;color:white}button{width:100%;cursor:pointer;margin-top:6px}#status{font-size:12px;min-height:2.8em}
</style></head><body><h1>Фиолетовое свечение</h1><p>Действует только после нажатия и только на пустых декоративных областях. После изменения страницы эффект выключится.</p><label>Эффект <select id="mode"><option value="animated">Мягкое движение</option><option value="static">Без движения</option></select></label><label>Цвет <select id="color"><option value="purple">Фиолетовый</option><option value="blue">Синий</option><option value="turquoise">Бирюзовый</option><option value="pink">Розовый</option></select></label><button id="apply">Включить на этой вкладке</button><button id="remove">Выключить</button><button id="newtab">Открыть страницу с часами</button><p id="status" role="status"></p><script src="popup.js"></script></body></html>
